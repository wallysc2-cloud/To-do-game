name: Test and publish web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot and web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p ~/godot "$T"
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz 'templates/web_*' 'templates/version.txt' -d "$T"
          rm templates.tpz

      - name: Smoke test (300 levels are solvable, then a bot plays a run)
        run: |
          G=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          $G --headless --import --path . > /dev/null 2>&1 || true
          out=$($G --headless --path . -- --autotest=levels 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | grep "LEVELTEST.*failures=0" || { echo "$out"; exit 1; }
          if echo "$out" | grep -E "SCRIPT ERROR|ERROR:"; then exit 1; fi
          out=$($G --headless --fixed-fps 60 --path . -- --autotest=play 2>&1)
          echo "$out" | grep PLAYTEST || { echo "$out"; exit 1; }
          if echo "$out" | grep -E "SCRIPT ERROR|ERROR:"; then exit 1; fi

      - name: Export for the web
        run: |
          mkdir -p build/web
          ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
